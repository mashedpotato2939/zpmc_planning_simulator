/**:
  ros__parameters:
    wheel_radius: 0.67 # The radius of the wheel, primarily used for dead reckoning.
    wheel_width: 0.42 # The lateral width of a wheel tire, primarily used for dead reckoning.
    wheel_base: 6.0 #3.0 # between front wheel center and rear wheel center
    wheel_tread: 2.505 # between left wheel center and right wheel center
    front_overhang: 4.5 # between front wheel center and vehicle front
    rear_overhang: 4.5 # between rear wheel center and vehicle rear
    left_overhang: 0.2375 # between left wheel center and vehicle left
    right_overhang: 0.2375 # between right wheel center and vehicle right
    vehicle_height: 2.55
    max_steer_angle: 0.6 # [rad]

    # Derived dimensions for planning/control nodes
    vehicle_length: 15.0  # front_overhang(4.5) + wheel_base(6.0) + rear_overhang(4.5)
    vehicle_width: 2.98   # wheel_tread(2.505) + left_overhang(0.2375) + right_overhang(0.2375)

    # 4WS/Q-turn parameters
    qturn_min_radius: 8.5  # meters - minimum Q-turn radius for IGV

    # Oblique mode parameters (IGV defaults)
    oblique_max_lateral_distance: 8.0   # meters - max lateral displacement for oblique
    oblique_min_arc_length: 1.5         # meters - minimum arc length for oblique entry/exit
    lane_change_lateral_threshold: 1.5  # meters - lateral offset to trigger oblique

    # Motion control lookahead parameters (tuned for full-size IGV)
    min_lookahead_distance: 4.35      # meters - minimum lookahead distance
    max_lookahead_distance: 15.0      # meters - maximum lookahead distance
    reverse_min_lookahead_distance: 4.5  # meters - minimum lookahead for reverse
