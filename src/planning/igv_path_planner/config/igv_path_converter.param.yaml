# FMS Path Converter Node Parameters
# This configuration file controls how FMS paths are converted to Autoware paths

/**:
  ros__parameters:
    # FMS Protocol Plugin
    # "default" = ICD-aligned protocol (FMSRouteWindow/FMSStopPoint input, full uplink reporting)
    # "legacy"  = backward-compatible (FMSPath/JSON input, no uplink reporting)
    fms_protocol:
      type: "default"
      default:
        route_topic: "~/input/route_window"
        stop_topic: "~/input/stop_point"
      legacy:
        fms_path_topic: "~/input/fms_path"
        use_json_input: false
        fms_json_topic: "~/input/fms_json"

    # Vehicle identification (for uplink reporting)
    vehicle_id: "v001"
    arrival_threshold: 3.0            # Distance threshold for arrival detection (meters)

    # Frame settings
    frame_id: "map"                    # Coordinate frame for output path

    # Velocity settings
    default_velocity: 5.0              # Default velocity when not specified by FMS (m/s)
    min_velocity: 0.5                  # Minimum velocity (m/s)
    max_velocity: 15.0                 # Maximum velocity (m/s)

    # Path generation settings
    path_interval: 1.0                 # Interpolation interval (meters)
    forward_path_length: 100.0         # Forward path length from ego (meters)
    backward_path_length: 1.0          # Backward path length from ego (meters)

    # Ego-off-route re-anchor trigger. route_bridge publishes the full route;
    # this node selects the active segment and truncates the published path around ego.
    # When the ego's lateral offset from the cached path exceeds this threshold,
    # the selected segment is rebuilt and re-anchored to the current ego pose.
    replan_lateral_deviation_threshold: 1.0   # meters

    # Connection settings
    stale_threshold: 5.0               # Time before FMS is considered disconnected (seconds)
    publish_rate: 10.0                 # Path publish rate (Hz)

    # Segment selection accepts either direct projection onto the active segment
    # or a virtual connector from ego pose to the segment's first point.
    segment_tracking:
      max_distance: 13.0               # Max projection distance from ego to current segment (m)
      max_yaw_error: 1.57              # Max heading error on current segment projection (rad)
      connector_max_distance: 50.0     # Max ego-to-first-point connector length (m)
      connector_max_yaw_error: 0.785   # Max heading error for ego-to-first-point connector (rad)
      endpoint_distance: 1.0
      stopped_speed: 0.1
      stopped_duration: 1.0
      ambiguity_margin: 0.25
      backtrack_tolerance: 1.0
      progress_slack: 2.0

    # Crab-walking avoidance is limited to constant-heading NORMAL / LC runs.
    # A Q-turn is never modified; when currently in Q-turn, the next run can
    # be planned from its own first point.
    crab_avoidance:
      enable: false
      dynamic_obstacles:
        enable: false                # false: every perceived object is static
      object_timeout: 1.0
      clearance: 0.5
      max_lateral_offset: 3.5
      lateral_sampling_interval: 0.25
      longitudinal_sampling_interval: 1.0
      min_collision_free_distance: 20.0
      local_map_forward_x: 50.0
      start_point_mindis_threshold: 1.0
      steer_angle_max_deg: 30.0
      steer_angular_vel_max_deg_s: 30.0
      return_length_lateral_ratio: 5.0
      reference_merge_slope_tolerance: 0.02
      max_heading_curvature: 0.05   # rad/m
      max_heading_deviation: 0.25   # rad from run's first heading

    # Processing options
    enable_velocity_profile: true      # Enable automatic velocity profiling

    # Workaround for elastic_band_smoother stop-boundary jitter: append a short
    # zero-velocity tail past the destination so the downstream smoother's
    # is_stop_point_inside_trajectory check doesn't drop the stop intermittently
    # (which otherwise causes the trajectory's terminal velocity to flip 0<->5
    #  and produces periodic speed dips on the controller's lookup).
    enable_goal_tail: true             # Append v=0 tail past the destination
    goal_tail_length: 3.0              # Total tail length past destination (m)
    goal_tail_step: 0.5                # Spacing of tail points (m)

    # Intelligent Path Generation (for sparse FMS waypoints)
    # When enabled, the converter will detect maneuver types (lane changes, turns, curves)
    # and generate smooth paths using Bezier curves and quintic polynomials
    # NOTE: Disable this when using fms_goal_path_generator which already creates proper Q-turn paths
    enable_intelligent_path_generation: true

    # Lane change detection: lateral offset threshold to detect lane change
    lane_change_lateral_threshold: 1.5  # meters (typical lane width is 3.5m)

    # Turn detection: yaw change threshold to detect turns
    turn_yaw_threshold: 0.3             # radians (~17 degrees)

    # Minimum length for lane change maneuver
    min_lane_change_length: 10.0        # meters

    # Velocity ratio during lane change (relative to default velocity)
    lane_change_velocity_ratio: 0.8     # 80% of default velocity

    # Target velocity during turns
    turn_speed: 3.0                     # m/s

    # Q-Turn (90° Fresnel-clothoid) parameters
    # Only elbows with |yaw_diff| in [qturn_yaw_min_threshold, qturn_yaw_max_threshold]
    # use the Fresnel algorithm; other turns fall back to Bezier TURN.
    qturn_speed_limit: 2.0              # Maximum speed during Q-turns (m/s)
    qturn_min_radius: 15.5              # Position-clothoid apex radius R (m) — matches map_traj_server
    qturn_yaw_min_radius: 8.1           # Heading-clothoid radius (m) — produces 4WS sideslip

    # Drivable Area Generation
    # Required by downstream Path Smoother and Path Optimizer
    # If disabled, FMS must provide left_bound and right_bound in the path
    generate_drivable_area: false        # Generate synthetic bounds from path
    lane_width: 3.5                     # Total lane width (meters)
    left_bound_offset: -1.0             # Left offset from centerline (-1 = lane_width/2)
    right_bound_offset: -1.0            # Right offset from centerline (-1 = lane_width/2)

    # Curvature-Based Drivable Area Expansion
    # For large vehicles (like IGV), the fixed lane_width may not be sufficient
    # during turns. This feature dynamically expands the drivable bounds based
    # on the path curvature and vehicle dimensions to ensure the vehicle footprint
    # stays within bounds during maneuvers.
    #
    # NOTE: Vehicle dimensions are loaded from vehicle_info.param.yaml at launch time.
    # The defaults below are for IGV and will be overridden by the vehicle's actual params.
    enable_curvature_expansion: true    # Enable dynamic bound expansion based on curvature
    vehicle_length: 15.0                # Total vehicle length (meters) - overridden by vehicle_info
    vehicle_width: 3.0                  # Total vehicle width (meters) - overridden by vehicle_info
    vehicle_front_overhang: 4.5         # Distance from front axle to front bumper - overridden
    vehicle_wheel_base: 6.0             # Distance between front and rear axles - overridden (wheel_base)
    min_bound_margin: 1.0               # Minimum clearance from vehicle edge to bound (meters) - increased for safety

    # 4WS (Four-Wheel Steering) Support
    # Enables lateral_velocity_mps in path points to signal 4WS steering
    # The controller uses this to achieve counter-phase 4WS for reduced swept area
    enable_4ws: true                    # Enable 4WS lateral velocity calculation
    max_lateral_velocity: 2.0           # Maximum lateral velocity (m/s) - allows up to ~34° sideslip at 3m/s
    curvature_4ws_threshold: 0.01       # Minimum curvature to trigger 4WS (1/m = 100m radius)
    lateral_velocity_gain: 1.5          # Gain factor for lateral velocity calculation
                                        # v_y = curvature * v_x * gain
                                        # At Q-turn apex (8.5m radius, 3m/s): v_y = 0.117 * 3.0 * 1.5 = 0.53 m/s
                                        # This gives sideslip beta = atan2(0.53, 3.0) ≈ 10°

    # Oblique (Crab-walking) Lane Change Parameters
    # Piecewise-parabolic lateral profile ported from map_traj_server.
    # The vehicle moves diagonally using lateral_velocity while keeping its heading constant.
    oblique_speed_limit: 2.0              # Maximum speed during oblique lane changes (m/s)
    oblique_max_lateral_distance: 4.0     # Maximum lateral displacement (meters) — maneuver gating
    crab_dymax: 0.5236                    # Max |dy/dx| (radians, 30°)
    crab_ddymax: 0.5236                   # Max |d^2y/dx^2| (rad/m)
    crab_ddymin: 0.0                      # Feasibility threshold on |d^2y/dx^2|

    # HD Map Lane Snapping (ZPMC HD Map)
    # When the Lanelet2 map loader publishes the vector map, waypoints are projected onto lane centerlines.
    # Falls back to geometric generation if map is unavailable or waypoints are off-map.
    map_snap_distance_threshold: 5.0     # Max distance (m) from waypoint to nearest lane
    use_lane_speed_limits: false          # Override FMS speed limits with lane speed limits from map
