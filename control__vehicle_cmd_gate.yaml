/control/vehicle_cmd_gate:
  ros__parameters:
    check_external_emergency_heartbeat: false
    diagnostic_updater:
      period: 1.0
    emergency_acceleration: -2.4
    enable_cmd_limit_filter: true
    external_emergency_stop_heartbeat_timeout: 0.0
    filter_activated_count_threshold: 5
    filter_activated_velocity_threshold: 1.0
    front_overhang: 4.5
    left_overhang: 0.2375
    max_steer_angle: 0.436
    moderate_stop_service_acceleration: -1.5
    nominal:
      actual_steer_diff_lim:
      - 1.0
      - 1.0
      - 1.0
      - 0.8
      lat_acc_lim:
      - 5.0
      - 5.0
      - 5.0
      - 4.0
      lat_jerk_lim:
      - 7.0
      - 7.0
      - 7.0
      - 6.0
      lon_acc_lim:
      - 5.0
      - 5.0
      - 5.0
      - 4.0
      lon_jerk_lim:
      - 80.0
      - 5.0
      - 5.0
      - 4.0
      reference_speed_points:
      - 0.1
      - 0.3
      - 20.0
      - 30.0
      steer_lim:
      - 1.0
      - 1.0
      - 1.0
      - 0.8
      steer_rate_lim:
      - 1.0
      - 1.0
      - 1.0
      - 0.8
      vel_lim: 25.0
    on_transition:
      actual_steer_diff_lim:
      - 1.0
      - 0.8
      lat_acc_lim:
      - 2.0
      - 1.8
      lat_jerk_lim:
      - 7.0
      - 6.0
      lon_acc_lim:
      - 1.0
      - 0.9
      lon_jerk_lim:
      - 0.5
      - 0.4
      reference_speed_points:
      - 20.0
      - 30.0
      steer_lim:
      - 1.0
      - 0.8
      steer_rate_lim:
      - 1.0
      - 0.8
      vel_lim: 50.0
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    rear_overhang: 4.5
    right_overhang: 0.2375
    stop_check_duration: 1.0
    stop_hold_acceleration: -1.5
    system_emergency_heartbeat_timeout: 0.5
    update_rate: 10.0
    use_emergency_handling: false
    use_sim_time: true
    vehicle_height: 2.55
    wheel_base: 6.0
    wheel_radius: 0.67
    wheel_tread: 2.505
    wheel_width: 0.42
